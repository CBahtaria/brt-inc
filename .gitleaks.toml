title = "brt-inc gitleaks config"

# Extends (does not replace) gitleaks' built-in default ruleset, so every stock rule
# (Stripe, Supabase, Resend, generic-api-key, etc.) still applies.
[extend]
useDefault = true

# `.next/` is gitignored, untracked build output regenerated by every `npm run build`.
# It coincidentally contains Next.js's own auto-generated Draft-Mode crypto keys
# (previewModeSigningKey / previewModeEncryptionKey in .next/cache/.previewinfo and
# .next/prerender-manifest.json), an RSC cache key that is literally a blog post slug
# (.next/cache/.rscinfo), and a webpack sourcemap content hash
# (.next/server/server-reference-manifest.json) — none are real secrets, but they
# coincidentally match the generic-api-key pattern.
#
# `.gitleaksignore` cannot express this: it only accepts exact `file:rule:line`
# fingerprints (verified — glob paths and partial fingerprints are both rejected as
# invalid entries), so it would need hand-updating every time a new blog post changes
# an RSC segment path or a rebuild shifts a line number. This allowlist instead excludes
# the whole directory by path regex, so it never needs touching again.
[allowlist]
paths = [
  '''^\.next/''',
]
