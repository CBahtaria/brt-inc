<!DOCTYPE html>
<!-- Copyright © 2026 BRT Inc. All rights reserved. Manzini, Eswatini. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRT Inc. Business Card — Charles Bartaria</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 20px; font-family: 'Segoe UI', system-ui, sans-serif; }
  h1 { color: #374151; font-size: 14px; font-weight: 500; }
  .card-pair { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { width: 85mm; height: 54mm; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.25); position: relative; }
  /* FRONT */
  .card-front { background: #0f172a; color: #fff; padding: 6mm; display: flex; flex-direction: column; justify-content: space-between; }
  .card-front .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .card-front .logo span { color: #f59e0b; }
  .card-front .name { font-size: 13px; font-weight: 700; color: #f1f5f9; }
  .card-front .title { font-size: 9px; color: #94a3b8; letter-spacing: 0.5px; margin-top: 1px; }
  .card-front .divider { height: 1px; background: linear-gradient(90deg, #f59e0b, transparent); margin: 3mm 0; }
  .card-front .contact { display: flex; flex-direction: column; gap: 2px; }
  .card-front .contact-item { font-size: 8px; color: #94a3b8; }
  .card-front .contact-item span { color: #f1f5f9; }
  .card-front .tagline { font-size: 7px; color: #475569; letter-spacing: 1px; text-transform: uppercase; }
  /* BACK */
  .card-back { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3mm; }
  .card-back .qr-wrap { background: #fff; padding: 3mm; border-radius: 3px; }
  .card-back .back-logo { font-size: 11px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.3px; }
  .card-back .back-logo span { color: #f59e0b; }
  .card-back .back-url { font-size: 7px; color: #64748b; }
  .card-back .corner-mark { position: absolute; bottom: 3mm; right: 4mm; font-size: 5px; color: #1e293b; }
  /* PRINT */
  @media print {
    @page {
      size: 85mm 54mm;
      margin: 0;
    }
    body { background: white; padding: 0; gap: 0; }
    h1 { display: none; }
    .card-pair { gap: 8mm; page-break-inside: avoid; }
    .card { box-shadow: none; border: 0.25mm solid #cbd5e1; }
    /* Crop marks */
    .card::before, .card::after { content: ''; position: absolute; background: #999; }
    .card::before { top: -3mm; left: 0; right: 0; height: 0.2mm; }
    .card::after { left: -3mm; top: 0; bottom: 0; width: 0.2mm; }
  }
</style>
</head>
<body>
<h1>BRT Inc. — Business Card</h1>
<div class="card-pair">
  <!-- FRONT -->
  <div class="card card-front">
    <div>
      <div class="logo">BRT<span> Inc.</span></div>
    </div>
    <div>
      <div class="name">Charles Bartaria</div>
      <div class="title">FOUNDER &amp; LEAD ENGINEER</div>
      <div class="divider"></div>
      <div class="contact">
        <div class="contact-item">✉ <span>charleskris9@gmail.com</span></div>
        <div class="contact-item">🌐 <span>brt-inc.vercel.app</span></div>
        <div class="contact-item">📍 <span>UNESWA, Kwaluseni · Matsapha, Eswatini</span></div>
      </div>
    </div>
    <div class="tagline">Engineering · Autonomy · Intelligence</div>
  </div>
  <!-- BACK -->
  <div class="card card-back">
    <div class="back-logo">BRT<span> Inc.</span></div>
    <div class="qr-wrap" id="qr"></div>
    <div class="back-url">brt-inc.vercel.app</div>
    <div class="corner-mark">© 2026 BRT Inc.</div>
  </div>
</div>
<script>
new QRCode(document.getElementById('qr'), {
  text: 'https://brt-inc.vercel.app',
  width: 80, height: 80,
  colorDark: '#0f172a', colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
